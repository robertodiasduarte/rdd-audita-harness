name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Content safety gate
        run: bash scripts/publish-check.sh

      - name: Validators compile
        run: python3 -m py_compile skills/*/scripts/*.py

      - name: Build skill zips
        run: bash scripts/package.sh

      - name: Publish GitHub Release with zips
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
